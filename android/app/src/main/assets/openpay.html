<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Tarjeta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      type="text/javascript"
      src="https://js.openpay.mx/openpay.v1.min.js"></script>
    <script
      type="text/javascript"
      src="https://js.openpay.mx/openpay-data.v1.min.js"></script>
  </head>
  <body>
    <div class="bg-white p-6 rounded-lg w-full">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Datos de Tarjeta</h2>

      <div>
        <label class="block text-gray-600 text-sm">Número de Tarjeta</label>
        <input
          type="number"
          id="card_number"
          class="w-full p-2 border rounded-lg mb-3"
          placeholder="4111 1111 1111 1111"
          required
          value="4111111111111111" />

        <label class="block text-gray-600 text-sm">Nombre del Titular</label>
        <input
          type="text"
          id="holder_name"
          class="w-full p-2 border rounded-lg mb-3"
          placeholder="Juan Pérez"
          value="Juan Pérez"
          required />

        <div class="flex space-x-2">
          <div class="w-1/2">
            <label class="block text-gray-600 text-sm">Mes Exp.</label>
            <input
              type="number"
              min="1"
              max="12"
              id="exp_month"
              class="w-full p-2 border rounded-lg"
              placeholder="MM"
              value="12"
              required />
          </div>
          <div class="w-1/2">
            <label class="block text-gray-600 text-sm">Año Exp.</label>
            <input
              type="text"
              id="exp_year"
              class="w-full p-2 border rounded-lg"
              placeholder="YY"
              value="25"
              required />
          </div>
        </div>

        <label class="block text-gray-600 text-sm mt-3">CVV</label>
        <input
          type="password"
          id="cvv"
          class="w-full p-2 border rounded-lg mb-3"
          placeholder="123"
          value="123"
          required />

        <div
          class="w-full p-2 bg-red-300 rounded-md mb-3 text-red-900 hidden"
          id="response_details"></div>

        <button
          id="send_button"
          type="button"
          class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600">
          Enviar
        </button>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const sendButton = document.getElementById('send_button');
        // ADD EVENT LISTENER FOR THE FORM
        sendButton.addEventListener('click', function () {
          sendButton.setAttribute('disabled', true);
          const cardData = validateCardData();
          // VALIDATE CARD DATA
          if (!cardData) {
            sendButton.removeAttribute('disabled');
            return;
          }
          // SET OPENPAY CONFIG
          OpenPay.setId('m2zthcewyiek63m2ormj');
          OpenPay.setApiKey('pk_c1d1fbbe58e34ecc9027ff6df46bb929');
          // TRUE FOR DEV MODE AND FALSE FOR PRODUCTION MODE
          OpenPay.setSandboxMode(true);
          // GET DEVICE DATA ID
          const deviceSessionId = OpenPay.deviceData.setup();
          //  CREAR TOKEN DE TARJETA
          OpenPay.token.create(cardData, onSuccess, onError);
        });
      });

      function validateCardData() {
        const responseDetails = document.getElementById('response_details');
        responseDetails.classList.add('hidden');
        const values = {
          card_number: document.getElementById('card_number').value,
          holder_name: document.getElementById('holder_name').value,
          exp_month: document.getElementById('exp_month').value,
          exp_year: document.getElementById('exp_year').value,
          cvv2: document.getElementById('cvv').value,
        };
        // VALIDATE CARD NUMBER
        if (!OpenPay.card.validateCardNumber(values.card_number)) {
          responseDetails.innerHTML = 'Número de tarjeta invalido';
          responseDetails.classList.remove('hidden');
          return null;
        }
        // VALIDATE CVC CODE
        if (!OpenPay.card.validateCVC(values.cvv2, values.card_number)) {
          responseDetails.innerHTML = 'Código CVV invalido';
          responseDetails.classList.remove('hidden');
          return null;
        }
        // VALIDATE EXPIRATION DATE
        if (!OpenPay.card.validateExpiry(values.exp_month, values.exp_year)) {
          responseDetails.innerHTML = 'Fecha de expiración invalida';
          responseDetails.classList.remove('hidden');
          return null;
        }
        // VALID CARD INFORMATION
        return {
          card_number: values.card_number,
          holder_name: values.holder_name,
          expiration_month: values.exp_month,
          expiration_year: values.exp_year,
          cvv2: values.cvv2,
        };
      }
      // ON SUCCES TOKEN
      function onSuccess(response) {
        const sendButton = document.getElementById('send_button');
        console.log('success: ', response);
        window.ReactNativeWebView.postMessage(JSON.stringify(response));
        sendButton.removeAttribute('disabled');
      }
      // ON ERROR TOKEN
      function onError(response) {
        const sendButton = document.getElementById('send_button');
        console.log('error: ', response);
        window.ReactNativeWebView.postMessage(JSON.stringify(response));
        sendButton.removeAttribute('disabled');
      }
    </script>
  </body>
</html>
